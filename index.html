<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAPSTAR - Coming Soon</title>
    
    <!-- Meta tags para previsualización (WhatsApp, iMessage, Instagram, etc) -->
    <meta property="og:title" content="CAPSTAR - ENTRA AL CLUB">
    <meta property="og:description" content="Acceso anticipado, drops exclusivos y sorpresas antes que todos.">
    <meta property="og:image" content="https://capstarclub.com/preview.jpg">
    <meta property="og:url" content="https://capstarclub.com/">
    <meta property="og:type" content="website">
    
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://capstarclub.com/preview.jpg">
    <meta name="twitter:title" content="CAPSTAR - ENTRA AL CLUB">
    <meta name="twitter:description" content="Acceso anticipado, drops exclusivos y sorpresas antes que todos.">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Playfair+Display:ital,wght@1,400;1,600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css"> <!-- Reuse some global styles -->
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }
        .landing-logo {
            margin-bottom: 40px;
            z-index: 10;
        }
        .landing-logo img {
            max-height: 100px;
            width: auto;
        }
        .countdown {
            display: flex;
            gap: 20px;
            margin-bottom: 50px;
            font-family: var(--font-mono);
            z-index: 10;
        }
        .time-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .time-box .num {
            font-size: 48px;
            font-weight: 700;
            line-height: 1;
        }
        .time-box .label {
            font-size: 10px;
            color: var(--text-muted);
            letter-spacing: 2px;
            margin-top: 5px;
        }
        .email-section {
            width: 100%;
            max-width: 400px;
            background: #fff;
            padding: 30px;
            border: 1px solid #000;
            position: relative;
            z-index: 10;
        }
        .email-section h3 {
            font-weight: 900;
            font-size: 24px;
            margin-bottom: 10px;
            letter-spacing: -1px;
        }
        .email-section p {
            font-family: var(--font-mono);
            font-size: 11px;
            color: #666;
            margin-bottom: 20px;
        }
        .email-section input {
            width: 100%;
            padding: 12px;
            border: 1px solid #000;
            font-family: var(--font-mono);
            font-size: 12px;
            margin-bottom: 10px;
            outline: none;
        }
        .email-section button {
            width: 100%;
            padding: 14px;
            background: #000;
            color: #fff;
            border: 1px solid #000;
            font-family: var(--font-sans);
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s;
        }
        .email-section button:hover {
            background: #fff;
            color: #000;
        }
        .success-msg {
            display: none;
            color: #3b82f6;
            font-family: var(--font-mono);
            font-size: 12px;
            margin-top: 15px;
        }
        .enter-atelier {
            margin-top: 50px;
            font-family: var(--font-mono);
            font-size: 10px;
            text-decoration: underline;
            color: #888;
            cursor: pointer;
            background: none;
            border: none;
            z-index: 10;
        }
        .enter-atelier:hover {
            color: #000;
        }

        /* Password Modal */
        #password-modal .modal-content {
            max-width: 320px;
        }
        
        @media (max-width: 480px) {
            .time-box .num { font-size: 36px; }
            .countdown { gap: 15px; }
        }
    </style>
</head>
<body>

<div class="watermark">SPECIMEN</div>

<div class="landing-logo">
    <img src="logo.png" alt="CAPSTAR Logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
    <h1 style="display: none; font-size: 52px; font-weight: 900; letter-spacing: -2px; margin: 0;">CAPST★R</h1>
</div>

<div class="countdown" id="countdown">
    <div class="time-box">
        <span class="num" id="cd-days">00</span>
        <span class="label">DAYS</span>
    </div>
    <div class="time-box">
        <span class="num" id="cd-hours">00</span>
        <span class="label">HOURS</span>
    </div>
    <div class="time-box">
        <span class="num" id="cd-mins">00</span>
        <span class="label">MINS</span>
    </div>
    <div class="time-box">
        <span class="num" id="cd-secs">00</span>
        <span class="label">SECS</span>
    </div>
</div>

<div class="email-section" id="email-section">
    <h3>ENTRA AL CLUB</h3>
    <p>Acceso anticipado, drops exclusivos y sorpresas antes que todos.</p>
    <form id="landing-email-form">
        <input type="email" id="landing-email" placeholder="INGRESA_TU_EMAIL@..." required>
        <button type="submit">AVISARME</button>
    </form>
    <div class="success-msg" id="landing-success-msg">Ya quedaste registrado. Prepárate.</div>
</div>

<button class="enter-atelier" id="btn-enter-atelier">ENTER ATELIER (STAFF ONLY)</button>

<!-- Password Modal -->
<div class="modal-overlay" id="password-modal">
    <div class="modal-content">
        <button class="close-btn" id="close-pwd-modal">&times;</button>
        <h3 class="modal-title" style="font-size: 20px;">SECURITY CLEARANCE</h3>
        <p class="mono-text desc" style="margin-bottom: 15px;">Enter passcode to access the store.</p>
        <form id="pwd-form">
            <input type="password" id="pwd-input" placeholder="PASSCODE" style="width:100%; padding:12px; margin-bottom:15px; font-family:var(--font-mono); border:1px solid #000;" required>
            <button type="submit" class="modal-submit" style="width: 100%;">VERIFY</button>
        </form>
        <div id="pwd-msg" class="mono-text" style="color:red; margin-top:10px;"></div>
    </div>
</div>

<script src="landing.js"></script>
</body>
</html>
